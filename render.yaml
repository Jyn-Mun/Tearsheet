# Render Blueprint for the Tearsheet backend (FastAPI). RESEARCH-ONLY public build.
# Render → New → Blueprint → point at this repo. Set the `sync: false` secrets in the dashboard.
services:
  - type: web
    name: tearsheet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Data source: "edgar" or "hybrid" work from the cloud (EDGAR is unlimited); note that
      # yfinance is blocked from datacenter IPs, so prices may be n/a in production — use
      # "fixture" if you want every section populated for a baked basket of companies.
      - key: DATA_PROVIDER
        value: hybrid
      # SEC requires a descriptive contact in the User-Agent (sent on every sec.gov request).
      - key: SEC_USER_AGENT
        sync: false
      # PRODUCTION market-data source: Alpaca is keyed (not IP-blocked like Yahoo). Free keys at
      # alpaca.markets. (Or "twelvedata" with TWELVEDATA_API_KEY.) yfinance is dev-only.
      - key: DATA_SOURCE
        value: alpaca
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      # Resilience: serve the request path from cache/pre-fetch only (no live call per visitor),
      # and run the in-process pre-fetch scheduler to warm it.
      - key: SERVE_FROM_CACHE_ONLY
        value: "true"
      - key: ENABLE_PREFETCH
        value: "true"
      - key: PREFETCH_INTERVAL_HOURS
        value: "6"
      # CORS lock — set to your exact Netlify URL, e.g. https://tearsheet.netlify.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Research-only: keep trading OFF in production.
      - key: ENABLE_TRADING
        value: "false"
      # Optional, all free / degrade gracefully if unset:
      - key: FRED_API_KEY
        sync: false        # 10y Treasury for the DCF risk-free rate (else 4.3% fallback)
      - key: ANTHROPIC_API_KEY
        sync: false        # AI narrative; if unset, a clean "AI disabled" note is shown

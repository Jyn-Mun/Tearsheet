# Render Blueprint for the Tearsheet backend (FastAPI). RESEARCH-ONLY public build.
# Render → New → Blueprint → point at this repo. Set the `sync: false` secrets in the dashboard.
services:
  - type: web
    name: tearsheet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Data source: "edgar" or "hybrid" work from the cloud (EDGAR is unlimited); note that
      # yfinance is blocked from datacenter IPs, so prices may be n/a in production — use
      # "fixture" if you want every section populated for a baked basket of companies.
      - key: DATA_PROVIDER
        value: hybrid
      # SEC requires a descriptive contact in the User-Agent (sent on every sec.gov request).
      - key: SEC_USER_AGENT
        sync: false
      # Free Twelve Data key (https://twelvedata.com) — gives working PRICES in the cloud
      # (yfinance is blocked from datacenter IPs). Without it, fundamentals work but prices are n/a.
      - key: TWELVEDATA_API_KEY
        sync: false
      # CORS lock — set to your exact Netlify URL, e.g. https://tearsheet.netlify.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Research-only: keep trading OFF in production.
      - key: ENABLE_TRADING
        value: "false"
      # Optional, all free / degrade gracefully if unset:
      - key: FRED_API_KEY
        sync: false        # 10y Treasury for the DCF risk-free rate (else 4.3% fallback)
      - key: ANTHROPIC_API_KEY
        sync: false        # AI narrative; if unset, a clean "AI disabled" note is shown
